# Ti-FAD + ANCESTOR SUPERVISION at l_d=3 (2026-09-23, reviewer item 3): the baseline
# receives the same ancestor loss (phrase + apparatus levels, lambda 0.3, Kendall UW)
# as our model under the paper's coarse-supervision protocol (held_out_mode keep,
# the setting of the paper's l_d=3 runs). 4 GPUs x mb12 = effective 48.
# FineGym Table-3, SYSTEM 2 "Ti-FAD re-implementation": system-1 pathway
# (same name-only prompt — the stock Ti-FAD prompt is also "a video of
# action {}") + per-FPN-level text<-video cross-attention (TiCA/TVCA
# pattern, see libs/modeling/text_pathway.py TextVideoCrossAttnLevel for
# the documented deviations) + foreground head weighting of the decode
# score (eval: sigmoid(cls) * sigmoid(fg); the fork also has a cn head
# we do not replicate).
#
# Three-system comparison (finegym_t3_{base,tifad,champ}.yaml): all systems
# share the ActionFormerWithCLIP visual backbone + a frozen CLIPTextModel
# (openai/clip-vit-base-patch32) text side with ONE trainable Linear
# projection (text 512-d -> head_dim); classification = scaled cosine of the
# cls-head trunk features vs the class text embeddings, REPLACING the
# closed-set flat classifier. Localization (reg) heads untouched.
# Specialist/cascade heads of the v17 recipe are DISABLED — the comparison
# isolates the text pathway. Data/optimizer sections cloned from
# finegym_rgb_zsl_v17a_strict.yaml.
#
# Leakage-aware protocol (v17a-strict style): the fixed 20-class holdout
# (attribute table held_out_classes, injected by train_shard) stays in the
# training windows, but contributes NO action-level classification loss
# (held-out positive tokens row-masked AND held-out logit columns unmasked
# from focal supervision -> trained on seen classes only); regression is
# class-agnostic and keeps all positives (revert_num_pos_v4_style).
dataset_name: finegym_slide
train_split: ['train']
val_split: ['test']
round: 1000
active_learning_method: uniform
dataset: {
  train_json_file: /data3/xiaodan8/FineGym/annotation/Dec16/gym99_train_label.txt,
  val_json_file: /data3/xiaodan8/FineGym/annotation/Dec16/gym99_val_label.txt,
  num_classes: 99,
  num_phrases: 14,
  num_activities: 4,
  num_frames: 16,
  trunc_thresh: 0.5,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 288,
  window_length: 32,
  window_stride: 16,
  sample_stride: 16,
  use_raw_video: True,
  load_jpg: True,
  held_out_class_ids: [],
}
model: {
  fpn_type: identity,
  backbone_arch: [2, 2, 3],
  regression_range: [[0, 4], [4, 8], [8, 16], [16, 32]],
  max_buffer_len_factor: 6.0,
  n_mha_win_size: 19,
  # ZSL holdout bookkeeping (held-out id injection + seen/held-out eval split)
  aux_attribute_table_path: configs/finegym_attribute_table_v2.json,
  verbalizer_path_for_embedding: configs/finegym_zsl_verbalizer.json,
  # v17 specialist/cascade machinery OFF (text-pathway-only comparison)
  use_cascaded_hierarchy: False,
  use_aux_attribute_head: False,
  use_clip_text_head: False,
  use_contrastive_attrs: False,
  use_rotation_regression_head: False,
  strict_zsl: True,
  # ---- t3 shared text pathway ----
  use_text_cls_head: True,
  text_prompt_template: 'a video of action {}',
  # ---- system 2 (Ti-FAD) ----
  use_text_video_cross_attn: True,
  use_fg_head: True,
  # + ancestor supervision (AS) at both ancestor levels, as our l_d=3 model (reviewer item 3, 2026-09-23)
  use_activity_align_loss: True,
  activity_align_levels: [phrase, apparatus],
  # 16 GB memory knobs (CLIP runs 4 x 32 = 128 frames per step)
  use_grad_checkpoint: True,
  clip_forward_chunk: 64,
}
opt: {
  learning_rate: 0.0001,   # 2026-09-12: 01-17 setting (was 5.19e-5)
  epochs: 15,
  weight_decay: 0.05,
}
loader: {
  batch_size: 12,   # 4 GPUs x 12 = effective 48 (2026-09-23)
  num_workers: 8,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  revert_num_pos_v4_style: True,
  lambda_activity_align: 0.3,
  # Ti-FAD fg branch loss weight (fork adds fg_loss with weight 1)
  lambda_fg: 1.0,
}
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 2000,
  max_seg_num: 200,
  min_score: 0.001,
  multiclass_nms: True,
}
output_folder: ./ckpt/
deepspeed_config_path: configs/deepspeed_config_bf16_mb12.json
