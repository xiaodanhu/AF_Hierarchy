# FineGym Table-3, SYSTEM 3 "champion", STAGE 3 = VIDEO BRANCH of the
# action--sub-action attention (libs/modeling/vsa.py, Ti-FAD fork
# VideoSubtreeAttn v1: K=10 ordered chunks of the detached regression span,
# banded neighbour attention among the chunks, location feature queries
# [f_n; chunks]; output replaces the cls-trunk feature the cosine classifier
# reads; zero-init residuals => starts exactly at the stage-2 model).
# Trained on top of the FROZEN stage-2 champion with cached CLIP features:
#   scripts/cache_fg3_clip_feats.py  (once; /data3/xiaodan8/FineGym/cache_fg3_champ2)
#   deepspeed train_shard.py --config configs/finegym_t3_champ_stage3_vsa.yaml \
#     --output fg3_champ3_vsa \
#     --init_from ckpt/finegym_t3_champ_stage2_fg3_champ2/vit_best_model \
#     --freeze_except video_subtree_attn \
#     --feature_cache /data3/xiaodan8/FineGym/cache_fg3_champ2 \
#     --select_metric video_held_mAP -c 1
# Single GPU: micro-batch 48 = the 3 x 16 effective batch of stages 1-2.
# Schedule mirrors the THUMOS stage-3 recipe (tifad logs/vsa3_s0.log:
# everything frozen except vsa.*, lr 1e-4 warm-up + cosine, ~15 epochs).
dataset_name: finegym_slide
train_split: ['train']
val_split: ['test']
round: 1000
active_learning_method: uniform
dataset: {
  train_json_file: /data3/xiaodan8/FineGym/annotation/Dec16/gym99_train_label.txt,
  val_json_file: /data3/xiaodan8/FineGym/annotation/Dec16/gym99_val_label.txt,
  num_classes: 99,
  num_phrases: 14,
  num_activities: 4,
  num_frames: 16,
  trunc_thresh: 0.5,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 288,
  window_length: 32,
  window_stride: 16,
  sample_stride: 16,
  use_raw_video: True,
  load_jpg: True,
  held_out_class_ids: [],
}
model: {
  fpn_type: identity,
  backbone_arch: [2, 2, 3],
  regression_range: [[0, 4], [4, 8], [8, 16], [16, 32]],
  max_buffer_len_factor: 6.0,
  n_mha_win_size: 19,
  # ZSL holdout bookkeeping (held-out id injection + seen/held-out eval split)
  aux_attribute_table_path: configs/finegym_attribute_table_v2.json,
  verbalizer_path_for_embedding: configs/finegym_zsl_verbalizer.json,
  # v17 specialist/cascade machinery OFF (text-pathway-only comparison)
  use_cascaded_hierarchy: False,
  use_aux_attribute_head: False,
  use_clip_text_head: False,
  use_contrastive_attrs: False,
  use_rotation_regression_head: False,
  strict_zsl: True,
  # ---- t3 shared text pathway ----
  use_text_cls_head: True,
  text_prompt_template: 'a video of action {}',
  # ---- system 3 (champion) ----
  text_ensemble_path: configs/finegym_qwen_ensemble.json,
  text_phase_attention: True,
  text_sentence_dropout: 0.3,
  text_stem_degrade: 0.3,
  text_phase_neighbor_attention: True,   # APA phase-level attention (stage 2)
  use_video_subtree_attn: True,          # stage 3: video branch (vsa.py)
  video_subtree_K: 10,
  video_subtree_heads: 4,
  use_activity_align_loss: True,
  activity_align_levels: [phrase, apparatus],   # 4-level: apparatus > phrase > element > phase
  use_duration_prior: True,
  duration_prior_path: configs/finegym_t3_duration_prior.json,
  duration_prior_gamma: 0.3,
  # 16 GB memory knobs (CLIP runs 4 x 32 = 128 frames per step)
  use_grad_checkpoint: True,
  clip_forward_chunk: 64,
}
opt: {
  warmup_epochs: 2,
  learning_rate: 0.0001,
  epochs: 13,   # stage 3: 2 warm-up + 13 = 15 epochs (only video_subtree_attn trains)
  weight_decay: 0.05,
}
loader: {
  batch_size: 48,   # stage 3 on ONE GPU with cached features: 48 = the 3 x 16 effective batch of stages 1-2
  num_workers: 8,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  revert_num_pos_v4_style: True,
  # AS inner weight (THUMOS champion used TIFAD_FAMCE=0.3)
  lambda_activity_align: 0.3,
}
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 2000,
  max_seg_num: 200,
  min_score: 0.001,
  multiclass_nms: True,
}
output_folder: ./ckpt/
deepspeed_config_path: configs/deepspeed_config_bf16_mb48.json
