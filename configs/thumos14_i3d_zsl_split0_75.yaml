# THUMOS14 ZSL — split 0, 75/25 protocol (5 unseen classes, seed-42 split #0).
# Unseen: BaseballPitch, CleanAndJerk, Diving, FrisbeeCatch, SoccerPenalty.
# ZSL machinery = FineGym v17: cascaded phrase hierarchy (7 synthetic phrase
# groups) + 8 attribute specialists (THUMOS slots via specialist_specs override)
# + raw log-prob composition for held-out scoring. No rotation heads.
# of 10 splits, I3D). Transductive framing (unseen segments present unlabeled).
dataset_name: thumos14_raw
train_split: ['train']
val_split: ['test']
round: 1000
active_learning_method: uniform
dataset: {
  train_json_file: /data3/xiaodan8/thumos/annotations/thumos14_train_label.txt,
  val_json_file: /data3/xiaodan8/thumos/annotations/thumos14_test_label.txt,
  num_classes: 20,
  num_frames: 16,
  trunc_thresh: 0.5,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 288,
  window_length: 128,
  window_stride: 64,
  sample_stride: 4,
  use_raw_video: True,
  load_jpg: False,
  complete_only: True,
  feat_folder: /data3/xiaodan8/thumos/i3d_features,
  feat_file_ext: .npy,
  feat_native_stride: 4,
  feat_stride: 16,
  force_upsampling: False,
  input_dim: 2048,
  num_phrases: 7,
  num_activities: 1,
  # phrase GT derivation (action -> 7 synthetic phrase groups)
  verbalizer_path: configs/thumos_zsl/thumos14_verbalizer.json,
}
model: {
  backbone_type: convTransformer,
  backbone_arch: [2, 2, 4],
  input_dim: 2048,
  regression_range: [[0, 4], [4, 8], [8, 16], [16, 32], [32, 10000]],
  fpn_type: identity,
  max_buffer_len_factor: 6.0,
  n_mha_win_size: 19,
  num_classes: 20,
  num_phrases: 7,
  num_activities: 1,
  # ---- cascaded hierarchy (phrase only; no activity level) ----
  use_cascaded_hierarchy: True,
  cascade_phrase_levels: [0, 1, 2, 3],
  cascade_activity_levels: [],
  cascade_gradient_stop: False,
  verbalizer_path_for_embedding: configs/thumos_zsl/thumos14_verbalizer.json,
  # ---- attribute specialists (THUMOS semantics via specialist_specs) ----
  use_aux_attribute_head: False,
  aux_attribute_table_path: configs/thumos_zsl/thumos14_attrs_split0_75.json,
  use_clip_text_head: False,
  use_contrastive_attrs: False,
  use_rotation_regression_head: False,
  use_body_shape_head: True,          # slot = environment (6-way)
  use_direction_head: True,           # slot = force direction (4-way)
  use_multiplicity_head: True,        # slot = has_runup (binary)
  use_named_element_head: True,       # slot = implement (6-way)
  use_motion_category_head: True,     # slot = dominant motion (6-way)
  use_leg_configuration_head: True,   # slot = two_handed (binary)
  use_inverted_phase_head: True,      # slot = aerial_phase (binary)
  use_hands_on_apparatus_head: True,  # slot = rotational_windup (binary)
  specialist_head_n_head: 8,
  specialist_head_mha_win_size: 33,
  specialist_head_num_layers: 2,
  use_sibling_softmax: True,
  phrase_head_num_layers_override: 5,
  use_raw_log_prob: True,
  use_attr_axis_contrast: True,
  attr_axis_contrast_margin: 1.0,
}
opt: {
  learning_rate: 0.0003,
  epochs: 35,
  weight_decay: 0.05,
}
loader: {
  batch_size: 8,
  num_workers: 4,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  lambda_phrase_cls: 0.5,
  lambda_phrase_reg: 0.5,
  lambda_activity_cls: 0.0,
  lambda_activity_reg: 0.0,
  lambda_structural_consistency: 0.25,
  consistency_warmup_epochs: 2,
  consistency_ramp_epochs: 1,
  lambda_aux_attr: 0.0,
  lambda_clip: 0.0,
  lambda_contr: 0.0,
  lambda_body_shape: 0.5,
  lambda_direction: 0.5,
  lambda_multiplicity: 0.5,
  lambda_named_element: 0.5,
  lambda_motion_category: 0.5,
  lambda_leg_configuration: 0.5,
  lambda_inverted_phase: 0.5,
  lambda_hands_on_apparatus: 0.5,
  lambda_attr_axis_contrast: 0.5,
  held_out_body_shape_alpha: 0.1,
  held_out_direction_alpha: 0.1,
  held_out_multiplicity_alpha: 0.1,
  held_out_named_element_alpha: 0.1,
  held_out_motion_category_alpha: 0.1,
  held_out_leg_configuration_alpha: 0.1,
  held_out_inverted_phase_alpha: 0.1,
  held_out_hands_on_apparatus_alpha: 0.1,
  revert_num_pos_v4_style: True,
}
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 2000,
  max_seg_num: 200,
  min_score: 0.001,
  multiclass_nms: True,
  duration_thresh: 0.05,
}
output_folder: ./ckpt/
deepspeed_config_path: configs/deepspeed_config_bf16.json
